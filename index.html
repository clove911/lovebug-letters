
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovebug Letters ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Dancing+Script:wght@500;700&family=Pacifico&family=Playfair+Display:ital,wght@0,500;1,500&family=Quicksand:wght@400;600;700&display=swap');

:root {
  --pink: #ffdce5;
  --red: #c93654;
  --dark: #76263d;
  --cream: #fffaf3;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fff0f3;
  color: var(--dark);
  font-family: 'DM Sans', sans-serif;
}

header {
  text-align: center;
  padding: 25px 15px;
  background: #ffe1e9;
  border-bottom: 3px dashed #ef9caf;
}

.logo {
  font-family: 'Pacifico', cursive;
  color: var(--red);
  font-size: 32px;
}

.tagline {
  font-family: 'Dancing Script', cursive;
  font-size: 19px;
}

main {
  max-width: 1100px;
  margin: 25px auto;
  padding: 15px;
}

.intro {
  text-align: center;
  margin-bottom: 25px;
}

.intro h2 {
  font-family: 'Playfair Display', serif;
  color: var(--red);
}

.editor {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 22px;
  align-items: start;
}

.panel {
  background: white;
  padding: 20px;
  border: 2px solid #f6b9c8;
  border-radius: 18px;
  box-shadow: 4px 5px 0 #f5c4d0;
}

.letter {
  background: var(--cream);
  min-height: 510px;
  padding: 35px 28px;
  border: 2px dashed #e8a5b4;
  border-radius: 8px;
  position: relative;
  overflow-wrap: anywhere;
}

.letter h2 {
  text-align: center;
  font-family: 'Playfair Display', serif;
  color: var(--red);
}

.letter-meta {
  font-size: 12px;
  color: #b56a7e;
  margin-bottom: 25px;
}

#preview {
  white-space: pre-wrap;
  line-height: 1.9;
  min-height: 180px;
  font-size: 19px;
}

#preview:empty::before {
  content: "Your sweet little message goes here...";
  color: #c9a3ad;
}

#decorations {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 25px;
  justify-content: center;
}

.sticker {
  font-size: 27px;
  image-rendering: pixelated;
}

label {
  display: block;
  font-weight: 700;
  margin: 17px 0 7px;
  font-size: 14px;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 2px solid #f4c2cf;
  border-radius: 10px;
  font: inherit;
  color: var(--dark);
  background: #fffafd;
  outline: none;
}

textarea {
  min-height: 125px;
  resize: vertical;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--red);
}

button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 11px 15px;
  font: inherit;
  font-weight: 700;
}

.sticker-btn {
  background: #ffe8ee;
  margin: 4px;
  font-size: 20px;
}

.primary {
  width: 100%;
  margin-top: 18px;
  background: var(--red);
  color: white;
}

.primary:hover { background: #a92242; }

.secondary {
  background: #ffe5ec;
  color: var(--dark);
  margin-top: 10px;
}

footer {
  text-align: center;
  padding: 25px;
  font-family: 'Dancing Script', cursive;
  font-size: 19px;
}

@media(max-width: 720px) {
  .editor { grid-template-columns: 1fr; }
  .letter { min-height: 430px; }
  .logo { font-size: 27px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">♡ Lovebug Letters ♡</div>
  <div class="tagline">little letters, big feelings</div>
</header>

<main>

<section class="intro">
  <h2>Make someone smile today 💌</h2>
  <p>A little love, wrapped in a letter.</p>
</section>

<div class="editor">

<!-- LETTER PREVIEW -->
<section class="panel">
  <div class="letter" id="letter">
    <h2>To someone special ♡</h2>

    <div class="letter-meta">
      <span id="toPreview">To: My favourite person</span>
    </div>

    <div id="preview"></div>

    <div id="decorations"></div>

    <div style="text-align:right; margin-top:30px;
    font-family:'Dancing Script'; font-size:21px;">
      With love, <span id="fromPreview">Someone ♡</span>
    </div>
  </div>
</section>

<!-- EDITING PANEL -->
<section class="panel">

  <h3>♡ Your little letter</h3>

  <label>To whom?</label>
  <input id="recipient" placeholder="Someone special...">

  <label>Your name / nickname</label>
  <input id="sender" placeholder="From someone ♡">

  <label>Your message</label>
  <textarea id="message"
  placeholder="Write something sweet here..."></textarea>

  <label>Choose your font</label>
  <select id="font">
    <option value="'Dancing Script', cursive">Sweet Magnolia</option>
    <option value="'Playfair Display', serif">Dreamy Romance</option>
    <option value="'Pacifico', cursive">Cherry Pop</option>
    <option value="'Quicksand', sans-serif">Little Diary</option>
    <option value="'DM Sans', sans-serif">Vintage Love</option>
  </select>

  <label>Paper colour</label>
  <select id="paper">
    <option value="#fffaf3">Vanilla cream</option>
    <option value="#fff0f5">Baby pink</option>
    <option value="#fff5e9">Strawberry milk</option>
    <option value="#fffafa">Pure white</option>
  </select>

  <label>Decorate your letter ♡</label>

  <div>
    <button class="sticker-btn" onclick="addSticker('🌷')">🌷</button>
    <button class="sticker-btn" onclick="addSticker('🌸')">🌸</button>
    <button class="sticker-btn" onclick="addSticker('🍓')">🍓</button>
    <button class="sticker-btn" onclick="addSticker('🍫')">🍫</button>
    <button class="sticker-btn" onclick="addSticker('💗')">💗</button>
    <button class="sticker-btn" onclick="addSticker('🎀')">🎀</button>
    <button class="sticker-btn" onclick="addSticker('🧸')">🧸</button>
    <button class="sticker-btn" onclick="addSticker('✨')">✨</button>
  </div>

  <button class="secondary" onclick="clearStickers()">
    Clear decorations
  </button>

  <button class="primary" onclick="sealLetter()">
    Seal my letter 💌
  </button>

  <p id="status" style="font-size:12px;text-align:center;"></p>

</section>
</div>
</main>

<footer>
  Made with ♡ and a little bit of magic.
</footer>

<script>
const message = document.getElementById('message');
const preview = document.getElementById('preview');
const recipient = document.getElementById('recipient');
const sender = document.getElementById('sender');
const font = document.getElementById('font');
const paper = document.getElementById('paper');
const letter = document.getElementById('letter');

function updateLetter() {
  preview.textContent = message.value;
  preview.style.fontFamily = font.value;

  document.getElementById('toPreview').textContent =
    'To: ' + (recipient.value || 'My favourite person');

  document.getElementById('fromPreview').textContent =
    sender.value || 'Someone ♡';

  letter.style.background = paper.value;
}

[message, recipient, sender, font, paper].forEach(element => {
  element.addEventListener('input', updateLetter);
  element.addEventListener('change', updateLetter);
});

function addSticker(symbol) {
  const sticker = document.createElement('span');
  sticker.className = 'sticker';
  sticker.textContent = symbol;

  document.getElementById('decorations').appendChild(sticker);
}

function clearStickers() {
  document.getElementById('decorations').innerHTML = '';
}

function sealLetter() {
  if (!message.value.trim()) {
    document.getElementById('status').textContent =
      'Write a little message first! 💗';
    return;
  }

  document.getElementById('status').textContent =
    'Your letter is ready for its next little adventure! 💌';
}

updateLetter();
</script>

</body>
</html>
